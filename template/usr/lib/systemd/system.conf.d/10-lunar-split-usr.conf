# Extend systemd's default PATH so services find tools in /sbin and /bin.
#
# Upstream systemd assumes merged /usr and ships with a compiled-in
# DEFAULT_USER_PATH of /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin.
# On a non-merged /usr filesystem this leaves tools like mount, umount,
# modprobe, kmod, dmesg, findmnt (installed in /sbin and /bin) out of
# reach of services such as the dracut-*.service hooks, which causes
# boot failures in the initrd ("mount: command not found", etc.).
#
# On a merged /usr system /sbin and /bin are symlinks to the /usr
# counterparts already on the PATH, so appending them is a no-op there.
[Manager]
DefaultEnvironment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
